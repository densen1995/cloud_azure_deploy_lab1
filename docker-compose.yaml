# Runs both services together for local testing.
# Backend:  http://localhost:8000/docs
# Frontend: http://localhost:8501
services:
  backend:
    container_name: eclipsebord-backend
    build:
      context: .                              # build from the project root
      dockerfile: dockerfiles/backend.dockerfile
    ports:
      - "8000:8000"
    image: eclipsebord01-bfaybubuhjhqgude.azurecr.io/backend:v1
   


  frontend:
    container_name: eclipsebord-frontend
    build:
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    ports:
    - "8501:8501"
    environment:
    # Inside the compose network the backend is reachable by its service name.
      BACKEND_URL: http://backend:8000
    depends_on:
    - backend
    image: eclipsebord01-bfaybubuhjhqgude.azurecr.io/frontend:v1



