[project]
name = "backend"
version = "0.1.0"
description = "eClipseBord FastAPI backend"
readme = "README.md"
authors = [
    { name = "Dennis Chinecherem", email = "densenj@outlook.com" }
]
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "pandas"]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
